name: inception

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file: .env
    restart: always
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception-network
    volumes:
      - mariadb-data:/var/lib/mysql

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    restart: always
    depends_on:
      - mariadb
    secrets:
      - db_password
      - credentials
    networks:
      - inception-network
    volumes:
      - wordpress-data:/var/www/html

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    env_file: .env
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception-network
    volumes:
      - wordpress-data:/var/www/html

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt

networks:
  inception-network:
    driver: bridge

volumes:
  wordpress-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nakbas/data/wordpress
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nakbas/data/mariadb
